<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#E8912B"/>
    </marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#5B6472"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#C2C4D4; stroke-width:1.8; }
      .prim  { font-size:19px; font-weight:700; fill:#20203A; }
      .sub   { font-size:14px; fill:#454D5E; }
      .sec   { font-size:13px; font-weight:700; fill:#6B6B90; letter-spacing:1px; }
      .note  { font-size:13.5px; font-style:italic; fill:#5B6472; }
      .edge  { font-size:13.5px; fill:#4B5563; }
      .eO    { stroke:#E8912B; stroke-width:3.2; fill:none; }
      .eG    { stroke:#5B6472; stroke-width:2.2; fill:none; }
      .eD    { stroke:#7A7A95; stroke-width:2; fill:none; stroke-dasharray:3 4; }
      .grp   { fill:none; stroke-dasharray:5 5; stroke-width:1.8; }
      text   { dominant-baseline:middle; }
    </style>
  </defs>

  <!-- ===================== TITLE BAR ===================== -->
  <rect x="0" y="0" width="1600" height="76" fill="#141439"/>
  <rect x="42" y="28" width="22" height="22" fill="#F5A623"/>
  <text x="78" y="40" font-size="30" font-weight="700" fill="#ffffff">IctalX Software Architecture</text>
  <text x="1560" y="40" font-size="16" fill="#B9B9D0" letter-spacing="1.5" text-anchor="end">DESIGN &amp; IMPLEMENTATION VIEW</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="1214" y="100" width="356" height="176" rx="10" fill="#ffffff" stroke="#C2C4D4" stroke-width="1.8"/>
  <text x="1236" y="128" class="sec">LEGEND</text>
  <line x1="1236" y1="158" x2="1300" y2="158" class="eO" marker-end="url(#arrOrange)"/>
  <text x="1312" y="158" class="sub">Primary path (upload &#8594; export)</text>
  <line x1="1236" y1="192" x2="1300" y2="192" class="eG" marker-end="url(#arrGrey)"/>
  <text x="1312" y="192" class="sub">Supporting flow</text>
  <line x1="1236" y1="226" x2="1300" y2="226" class="eD" marker-end="url(#arrGrey)"/>
  <text x="1312" y="226" class="sub">Information flow (non-operational)</text>
  <rect x="1236" y="250" width="64" height="20" rx="5" fill="#ECECF8" stroke="#9A9AC4" class="grp"/>
  <text x="1312" y="260" class="sub">Grouping / retained store</text>

  <!-- ===================== MAIN VERTICAL FLOW ===================== -->
  <!-- Researcher pill -->
  <rect x="540" y="100" width="300" height="50" rx="25" fill="#34348A"/>
  <text x="690" y="126" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Researcher / EEG reviewer</text>

  <!-- Browser interface -->
  <rect x="525" y="198" width="330" height="50" rx="10" class="box"/>
  <text x="690" y="224" class="prim" text-anchor="middle" font-weight="400" font-size="17">Browser-based IctalX interface</text>

  <!-- FastAPI backend -->
  <rect x="540" y="300" width="300" height="62" rx="10" fill="#ffffff" stroke="#3B3B9C" stroke-width="2.6"/>
  <text x="690" y="332" font-size="20" font-weight="700" fill="#2B2B7A" text-anchor="middle">FastAPI backend</text>

  <!-- Input handler -->
  <rect x="540" y="418" width="300" height="52" rx="10" class="box"/>
  <text x="690" y="445" text-anchor="middle" font-size="17" fill="#20203A">Input &amp; metadata handler</text>

  <!-- ===================== DEPLOYMENT OPTIONS ===================== -->
  <rect x="40" y="300" width="256" height="152" rx="12" fill="#F4F4FB" stroke="#9A9AC4" class="grp"/>
  <text x="60" y="326" class="sec">DEPLOYMENT OPTIONS</text>
  <rect x="62" y="344" width="212" height="44" rx="8" class="box"/>
  <text x="168" y="367" text-anchor="middle" font-size="16" fill="#2B2B7A">Hosted server</text>
  <rect x="62" y="396" width="212" height="44" rx="8" class="box"/>
  <text x="168" y="419" text-anchor="middle" font-size="16" fill="#2B2B7A">Local / offline version</text>

  <!-- ===================== FASTAPI ENDPOINTS ===================== -->
  <rect x="900" y="300" width="360" height="180" rx="12" class="box"/>
  <text x="920" y="326" class="sec">FASTAPI SERVICE ENDPOINTS</text>
  <text x="920" y="356" font-size="15"><tspan font-weight="700" fill="#E8912B">GET</tspan><tspan fill="#454D5E"> / serve interface</tspan></text>
  <text x="920" y="384" font-size="15"><tspan font-weight="700" fill="#E8912B">POST</tspan><tspan fill="#454D5E"> /api/detect run detection</tspan></text>
  <text x="920" y="412" font-size="15"><tspan font-weight="700" fill="#E8912B">POST</tspan><tspan fill="#454D5E"> /api/review save decision</tspan></text>
  <text x="920" y="440" font-size="15"><tspan font-weight="700" fill="#E8912B">GET</tspan><tspan fill="#454D5E"> /api/report download</tspan></text>
  <text x="920" y="468" font-size="15"><tspan font-weight="700" fill="#E8912B">GET</tspan><tspan fill="#454D5E"> /api/samples sample data</tspan></text>

  <!-- ===================== UPLOAD INPUTS ===================== -->
  <rect x="58" y="560" width="234" height="70" rx="10" class="box"/>
  <text x="175" y="583" text-anchor="middle" font-size="16" font-weight="600" fill="#20203A">EDF / CSV / PICKLE upload</text>
  <text x="175" y="606" text-anchor="middle" class="sub">single-channel mouse EEG</text>
  <rect x="316" y="560" width="204" height="70" rx="10" class="box"/>
  <text x="418" y="583" text-anchor="middle" font-size="16" font-weight="600" fill="#20203A">Channel, sampling rate,</text>
  <text x="418" y="606" text-anchor="middle" class="sub">unit, start time</text>

  <!-- ===================== DETECTION PIPELINE ===================== -->
  <rect x="512" y="520" width="356" height="470" rx="14" fill="#FCF4E1" stroke="#F0A83C" stroke-width="2.2"/>
  <text x="532" y="546" class="sec" fill="#B9791E">DETECTION PIPELINE</text>

  <!-- Preprocessing -->
  <rect x="536" y="560" width="308" height="122" rx="9" class="box"/>
  <rect x="536" y="560" width="8" height="122" rx="4" fill="#F5A623"/>
  <text x="694" y="586" text-anchor="middle" font-size="18" font-weight="700" fill="#20203A">Preprocessing</text>
  <text x="694" y="612" text-anchor="middle" class="sub">DC removal</text>
  <text x="694" y="632" text-anchor="middle" class="sub">Notch filtering</text>
  <text x="694" y="652" text-anchor="middle" class="sub">Median / MAD normalisation</text>
  <text x="694" y="672" text-anchor="middle" class="sub">Segmentation &#183; 5 s / 2.5 s overlap</text>

  <!-- TCN inference -->
  <rect x="536" y="702" width="308" height="50" rx="9" class="box"/>
  <rect x="536" y="702" width="8" height="50" rx="4" fill="#F5A623"/>
  <text x="694" y="728" text-anchor="middle" font-size="18" font-weight="700" fill="#20203A">MultiScale TCN inference</text>

  <!-- Event post-processing -->
  <rect x="536" y="772" width="308" height="112" rx="9" class="box"/>
  <rect x="536" y="772" width="8" height="112" rx="4" fill="#F5A623"/>
  <text x="694" y="798" text-anchor="middle" font-size="18" font-weight="700" fill="#20203A">Event Post-processing</text>
  <text x="694" y="822" text-anchor="middle" class="sub">probability smoothing</text>
  <text x="694" y="842" text-anchor="middle" class="sub">minimum-duration filtering</text>
  <text x="694" y="862" text-anchor="middle" class="sub">event merging</text>
  <text x="694" y="878" text-anchor="middle" class="sub" font-size="12">maximum-event filtering</text>

  <!-- Detected events -->
  <rect x="536" y="904" width="308" height="50" rx="9" fill="#ffffff" stroke="#F0A83C" stroke-width="2.4"/>
  <rect x="536" y="904" width="8" height="50" rx="4" fill="#F5A623"/>
  <text x="694" y="930" text-anchor="middle" font-size="18" font-weight="700" fill="#20203A">Detected seizure events</text>

  <!-- Review Manager -->
  <rect x="540" y="1040" width="300" height="60" rx="10" fill="#ffffff" stroke="#F0A83C" stroke-width="2.6"/>
  <text x="690" y="1070" text-anchor="middle" font-size="20" font-weight="700" fill="#20203A">Review Manager</text>

  <!-- Reporting & Export -->
  <rect x="540" y="1300" width="300" height="58" rx="10" fill="#ffffff" stroke="#F0A83C" stroke-width="2.6"/>
  <text x="690" y="1329" text-anchor="middle" font-size="19" font-weight="700" fill="#20203A">Reporting &amp; Export Module</text>

  <!-- Outputs -->
  <rect x="470" y="1418" width="180" height="50" rx="10" class="box"/>
  <text x="560" y="1444" text-anchor="middle" font-size="16" fill="#2B2B7A">events.csv</text>
  <rect x="672" y="1418" width="210" height="50" rx="10" class="box"/>
  <text x="777" y="1444" text-anchor="middle" font-size="16" fill="#2B2B7A">Summary report (.zip)</text>

  <!-- ===================== REPORTING LAYER (NON-OP) ===================== -->
  <rect x="40" y="1078" width="466" height="176" rx="12" fill="#F7F7FA" stroke="#B7B7C9" class="grp"/>
  <text x="62" y="1104" class="sec">REPORTING LAYER &#183; NON-OPERATIONAL</text>
  <rect x="70" y="1122" width="316" height="54" rx="9" class="box"/>
  <text x="228" y="1149" text-anchor="middle" font-size="17" font-weight="700" fill="#20203A">Natural-Language Results Assistant</text>
  <text x="72" y="1216" class="note">Performs no detection and does not alter the pipeline.</text>

  <!-- ===================== REVIEW WORKSPACE ===================== -->
  <rect x="918" y="560" width="474" height="440" rx="14" fill="#ECECF8" stroke="#CFCFE6" stroke-width="2"/>
  <text x="940" y="586" class="sec">REVIEW WORKSPACE (MASTER&#8211;DETAIL)</text>

  <rect x="944" y="600" width="422" height="56" rx="9" fill="#ffffff" stroke="#3B3B9C" stroke-width="2.4"/>
  <text x="1155" y="628" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2B7A">Event table (master list)</text>
  <text x="1172" y="678" class="edge">on select</text>

  <rect x="944" y="694" width="422" height="292" rx="10" fill="#F6F6FC" stroke="#CFCFE6" stroke-width="1.6"/>
  <text x="964" y="720" class="sec">DETAIL &#183; SELECTED EVENT</text>
  <rect x="964" y="738" width="192" height="60" rx="9" class="box"/>
  <text x="1060" y="768" text-anchor="middle" font-size="16" fill="#20203A">Waveform display</text>
  <rect x="1174" y="738" width="176" height="60" rx="9" class="box"/>
  <text x="1262" y="768" text-anchor="middle" font-size="16" fill="#20203A">Spectrogram display</text>
  <rect x="964" y="818" width="192" height="60" rx="9" class="box"/>
  <text x="1060" y="848" text-anchor="middle" font-size="16" fill="#20203A">Event descriptors</text>
  <rect x="1174" y="818" width="176" height="60" rx="9" class="box"/>
  <text x="1262" y="848" text-anchor="middle" font-size="15" fill="#20203A">Confirm / reject decision</text>

  <!-- ===================== STORAGE / DATA HANDLING ===================== -->
  <rect x="918" y="1140" width="474" height="330" rx="14" fill="#F1F1F9" stroke="#CFCFE6" class="grp" stroke-width="2"/>
  <text x="940" y="1166" class="sec">STORAGE / DATA HANDLING</text>
  <rect x="944" y="1184" width="422" height="50" rx="9" class="box"/>
  <text x="1155" y="1210" text-anchor="middle" font-size="16" fill="#20203A">Derived event metadata</text>
  <rect x="944" y="1250" width="422" height="50" rx="9" class="box"/>
  <text x="1155" y="1276" text-anchor="middle" font-size="16" fill="#20203A">Review decisions</text>
  <rect x="944" y="1316" width="422" height="50" rx="9" class="box"/>
  <text x="1155" y="1342" text-anchor="middle" font-size="16" fill="#20203A">Generated Summaries &amp; Reports</text>
  <text x="940" y="1404" class="note">Raw EEG is processed in memory and not retained by default.</text>
  <text x="940" y="1426" class="note">Derived metadata, review decisions, and reports may be retained or exported.</text>

  <!-- ===================== EDGES ===================== -->
  <!-- main grey verticals -->
  <line x1="690" y1="150" x2="690" y2="196" class="eG" marker-end="url(#arrGrey)"/>
  <line x1="690" y1="248" x2="690" y2="298" class="eG" marker-end="url(#arrGrey)"/>
  <text x="702" y="273" class="edge">HTTP/HTTPS</text>
  <line x1="690" y1="362" x2="690" y2="416" class="eG" marker-end="url(#arrGrey)"/>

  <!-- fastapi <-> endpoints (dotted) -->
  <line x1="840" y1="331" x2="898" y2="345" class="eD" marker-end="url(#arrGrey)"/>
  <!-- deployment -> fastapi (dotted) -->
  <line x1="296" y1="345" x2="538" y2="331" class="eD" marker-end="url(#arrGrey)"/>

  <!-- input handler -> uploads -->
  <polyline points="600,470 600,510 175,510 175,558" class="eG" marker-end="url(#arrGrey)"/>
  <polyline points="620,470 620,530 418,530 418,558" class="eG" marker-end="url(#arrGrey)"/>

  <!-- orange primary path -->
  <line x1="690" y1="470" x2="690" y2="558" class="eO" marker-end="url(#arrOrange)"/>
  <line x1="694" y1="682" x2="694" y2="700" class="eO" marker-end="url(#arrOrange)"/>
  <line x1="694" y1="752" x2="694" y2="770" class="eO" marker-end="url(#arrOrange)"/>
  <line x1="694" y1="884" x2="694" y2="902" class="eO" marker-end="url(#arrOrange)"/>
  <line x1="694" y1="954" x2="694" y2="1038" class="eO" marker-end="url(#arrOrange)"/>
  <line x1="690" y1="1100" x2="690" y2="1298" class="eO" marker-end="url(#arrOrange)"/>
  <text x="702" y="1200" class="edge">Generated summary/report</text>
  <!-- reporting -> outputs -->
  <polyline points="690,1358 690,1390 560,1390 560,1416" class="eO" marker-end="url(#arrOrange)"/>
  <polyline points="690,1358 690,1390 777,1390 777,1416" class="eO" marker-end="url(#arrOrange)"/>

  <!-- review manager -> event table (grey) -->
  <polyline points="840,1058 888,1058 888,628 942,628" class="eG" marker-end="url(#arrGrey)"/>
  <!-- event table -> detail -->
  <line x1="1155" y1="656" x2="1155" y2="692" class="eG" marker-end="url(#arrGrey)"/>

  <!-- review manager -> NL assistant (dotted, Detection results) -->
  <polyline points="540,1058 452,1058 452,1149 388,1149" class="eD" marker-end="url(#arrGrey)"/>
  <text x="470" y="1040" class="edge">Detection results</text>
  <!-- NL assistant -> reporting (dotted) -->
  <polyline points="452,1176 452,1328 538,1328" class="eD" marker-end="url(#arrGrey)"/>

  <!-- reporting -> generated summaries (grey) -->
  <polyline points="840,1328 894,1328 894,1341 942,1341" class="eG" marker-end="url(#arrGrey)"/>

  <!-- detail -> derived metadata (grey) -->
  <line x1="1120" y1="986" x2="1120" y2="1182" class="eG" marker-end="url(#arrGrey)"/>
  <!-- confirm/reject -> review decisions (grey, routed right) -->
  <polyline points="1350,848 1392,848 1392,1275 1368,1275" class="eG" marker-end="url(#arrGrey)"/>
</svg>
